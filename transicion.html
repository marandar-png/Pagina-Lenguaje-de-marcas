<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <style>
        /* Estilos para centrar todo */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212; /* Color de fondo oscuro */
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        .loader-container {
            text-align: center;
        }

        /* El círculo de carga */
        .loader {
            border: 8px solid #333;
            border-top: 8px solid #3498db; /* Color principal */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        /* Animación de rotación */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-weight: 300;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="loader"></div>
        <h2>CARGANDO</h2>
    </div>

    <script>
        // Redirigir a index.html tras 3 segundos (3000 milisegundos)
        setTimeout(function() {
            window.location.href = "index.html";
        }, 3000);
    </script>

</body>
</html>
